name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0

      - name: Deploy changed Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_ACCESS_TOKEN:-}" || -z "${SUPABASE_PROJECT_REF:-}" ]]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF GitHub secrets."
            exit 1
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [[ "$BEFORE" =~ ^0+$ ]]; then
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$AFTER" -- 'supabase/functions/*/index.ts')"
          else
            changed_files="$(git diff --name-only "$BEFORE" "$AFTER" -- 'supabase/functions/*/index.ts')"
          fi

          changed_functions="$(printf '%s\n' "$changed_files" | awk -F/ 'NF == 4 && $1 == "supabase" && $2 == "functions" && $4 == "index.ts" { print $3 }' | sort -u)"

          if [[ -z "$changed_functions" ]]; then
            echo "No Edge Function source files changed."
            exit 0
          fi

          while IFS= read -r name; do
            [[ -z "$name" ]] && continue
            if [[ ! "$name" =~ ^[a-z0-9-]+$ ]]; then
              echo "Refusing unexpected function name: $name"
              exit 1
            fi
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$SUPABASE_PROJECT_REF"
          done <<< "$changed_functions"

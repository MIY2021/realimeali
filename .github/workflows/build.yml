name: Build RealiMeali

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'index.html'
      - 'supabase/**'
      - '.github/workflows/**'
      - '.gitignore'
      - '.env.example'
      - 'capacitor.config.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Block vulnerable production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Report full dependency audit (including build tooling)
        shell: bash
        run: |
          if ! npm audit --audit-level=high; then
            echo "::warning::Development/build-tool dependencies still have high-severity advisories. Review the report and keep the affected toolchain out of the production dependency graph."
          fi

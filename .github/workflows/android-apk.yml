name: Build RealiMeali Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci

      - name: Build bundled web app
        run: npm run build

      - name: Generate Android project
        run: npx --yes @capacitor/cli@7 add android

      - name: Register native auth deep link and launcher icon
        run: node scripts/patch-android-deeplink.mjs

      - name: Install embedded Ocado WebView
        run: node scripts/patch-android-ocado-webview.mjs

      - name: Apply app-wide Android system-bar insets
        run: node scripts/patch-android-window-insets.mjs

      - name: Sync bundled assets to Android
        run: npx --yes @capacitor/cli@7 sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: realimeali-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

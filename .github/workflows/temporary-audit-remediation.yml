name: Temporary npm audit remediation

on:
  pull_request:
    branches: [main]
    paths:
      - 'SECURITY-AUDIT-TRIGGER.md'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Regenerate compatible dependency lock updates
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git log -1 --pretty=%s)" == "fix: remediate npm audit vulnerabilities" ]]; then
            echo "Dependency remediation already committed."
            exit 0
          fi
          npm ci
          npm audit fix || true
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm audit fix found no compatible changes."
            npm audit --omit=dev --audit-level=high || true
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate npm audit vulnerabilities"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

name: Temporary npm audit remediation

on:
  push:
    branches: [security/dependency-remediation]

permissions:
  contents: write

jobs:
  remediate:
    if: ${{ ! startsWith(github.event.head_commit.message, 'fix: remediate npm audit vulnerabilities') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply compatible security fixes
        run: npm audit fix || true
      - name: Commit lockfile remediation to this branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible npm audit fixes available."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: remediate npm audit vulnerabilities"
          git push
